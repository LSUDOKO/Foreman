name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # anvil for tests/contract (the fUSD EIP-3009 suite skips itself when anvil is missing)
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bun run typecheck
      - run: bun test
      # The committed abi+bytecode must be exactly what solc 0.8.24 produces from contracts/src.
      - name: contract artifact matches source
        run: bun scripts/compile-token.ts && git diff --exit-code contracts/ForemanTestUSD.json
      # Full five-customer run against the sandbox. No secrets: SERV decisions take the labelled fallback path.
      - run: bun run setup
      - run: bun run e2e
      - run: cd apps/console && bun run build
        if: hashFiles('apps/console/package.json') != ''
